    - uuid: c2266340549b4ef986cac116486379bc
      name: Windows services discovery
      type: ZABBIX_ACTIVE
      key: service.discovery
      delay: 1h
      filter:
        evaltype: AND
        conditions:
        - macro: '{#SERVICE.NAME}'
          value: '{$SERVICE.NAME.MATCHES}'
          formulaid: A
        - macro: '{#SERVICE.NAME}'
          value: '{$SERVICE.NAME.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
