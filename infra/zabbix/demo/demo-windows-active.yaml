zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 9348199005e84c5a891ddf088aa7889a
    name: Templates/Operating systems
  templates:
  - uuid: 4f5f7ec4a1354d2cb72dedb854283adb
    template: Demo Windows by Zabbix agent active
    name: Demo Windows by Zabbix agent active
    description: '데모용 복제본. 원본 ''Windows by Zabbix agent active''와 같고 두 가지만 다르다: system.cpu.util 수집 주기 30s, 트리거 ''Demo: CPU 1분 평균 85% 초과''(High) 추가.'
    vendor:
      name: Zabbix
      version: 7.0-2
    groups:
    - name: Templates/Operating systems
    items:
    - uuid: 769e779733a943fbaf8f9b56c09c748d
      name: Host name of Zabbix agent running
      type: ZABBIX_ACTIVE
      key: agent.hostname
      delay: 1h
      value_type: CHAR
      trends: '0'
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: component
        value: system
    - uuid: c3475946ece84a1ba39b306f0f7690cb
      name: Zabbix agent ping
      type: ZABBIX_ACTIVE
      key: agent.ping
      description: The agent always returns "1" for this item. May be used in combination with `nodata()` for the availability check.
      valuemap:
        name: Zabbix agent ping status
      tags:
      - tag: component
        value: system
      triggers:
      - uuid: 89a1a2aff1a14f57b852fc026fe78a7b
        expression: nodata(/Demo Windows by Zabbix agent active/agent.ping,{$AGENT.NODATA_TIMEOUT})=1
        name: 'Windows: Zabbix agent is not available'
        event_name: 'Windows: Zabbix agent is not available (or nodata for {$AGENT.NODATA_TIMEOUT})'
        priority: AVERAGE
        description: For active agents, `nodata()` with `agent.ping` is used with `{$AGENT.NODATA_TIMEOUT}` as a time threshold.
        manual_close: 'YES'
        tags:
        - tag: scope
          value: availability
    - uuid: 591530811e1540ddba5d5eee5178f2fb
      name: Version of Zabbix agent running
      type: ZABBIX_ACTIVE
      key: agent.version
      delay: 1h
      value_type: CHAR
      trends: '0'
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: component
        value: application
    - uuid: 9e8c356237a747ac877a4d90011adef4
      name: Cache bytes
      type: ZABBIX_ACTIVE
      key: perf_counter_en["\Memory\Cache Bytes"]
      units: B
      description: Cache Bytes is the sum of the Memory\\System Cache Resident Bytes, Memory\\System Driver Resident Bytes, Memory\\System Code Resident Bytes, and Memory\\Pool Paged Resident Bytes counters. This counter displays the last observed value only; it is not an average.
      tags:
      - tag: component
        value: memory
    - uuid: 5f774147513a47c992682ee14100c1b7
      name: Free system page table entries
      type: ZABBIX_ACTIVE
      key: perf_counter_en["\Memory\Free System Page Table Entries"]
      description: This indicates the number of page table entries not currently in use by the system. If the number is less than 5,000, there may be a memory leak or you running out of memory.
      tags:
      - tag: component
        value: memory
      triggers:
      - uuid: d97ec0ee4d90451bbc1c9be825b82134
        expression: max(/Demo Windows by Zabbix agent active/perf_counter_en["\Memory\Free System Page Table Entries"],5m)<{$MEM.PAGE_TABLE_CRIT.MIN}
        name: 'Windows: Number of free system page table entries is too low'
        event_name: 'Windows: Number of free system page table entries is too low (less {$MEM.PAGE_TABLE_CRIT.MIN} for 5m)'
        priority: WARNING
        description: '`Memory\Free System Page Table Entries` has been less than `{$MEM.PAGE_TABLE_CRIT.MIN}` for 5 minutes. If the number is less than 5,000, there may be a memory leak.'
        dependencies:
        - name: 'Windows: High memory utilization'
          expression: min(/Demo Windows by Zabbix agent active/vm.memory.util,5m)>{$MEMORY.UTIL.MAX}
        tags:
        - tag: scope
          value: capacity
    - uuid: 1b150e5fe91c4779b488c38dd49795c8
      name: Memory page faults per second
      type: ZABBIX_ACTIVE
      key: perf_counter_en["\Memory\Page Faults/sec"]
      value_type: FLOAT
      description: Page Faults/sec is the average number of pages faulted per second. It is measured in number of pages faulted per second because only one page is faulted in each fault operation, hence this is also equal to the number of page fault operations. This counter includes both hard faults (those that require disk access) and soft faults (where the faulted page is found elsewhere in physical memory.) Most processors can handle large numbers of soft faults without significant consequence. However, hard faults, which require disk access, can cause significant delays.
      tags:
      - tag: component
        value: memory
    - uuid: 47361adcd31542efb66576417b5e82a1
      name: Memory pages per second
      type: ZABBIX_ACTIVE
      key: perf_counter_en["\Memory\Pages/sec"]
      value_type: FLOAT
      description: 'This measures the rate at which pages are read from or written to disk to resolve hard page faults.

        If the value is greater than 1,000, as a result of excessive paging, there may be a memory leak.

        '
      tags:
      - tag: component
        value: memory
      triggers:
      - uuid: d70a8415963945ae986e74a907229134
        expression: min(/Demo Windows by Zabbix agent active/perf_counter_en["\Memory\Pages/sec"],5m)>{$MEM.PAGE_SEC.CRIT.MAX}
        name: 'Windows: The Memory Pages/sec is too high'
        event_name: 'Windows: The Memory Pages/sec is too high (over {$MEM.PAGE_SEC.CRIT.MAX} for 5m)'
        priority: WARNING
        description: The Memory Pages/sec in the last 5 minutes exceeds `{$MEM.PAGE_SEC.CRIT.MAX}`. If the value is greater than 1,000, as a result of excessive paging, there may be a memory leak.
        dependencies:
        - name: 'Windows: High memory utilization'
          expression: min(/Demo Windows by Zabbix agent active/vm.memory.util,5m)>{$MEMORY.UTIL.MAX}
        tags:
        - tag: scope
          value: capacity
    - uuid: 0335e6ac1d1842c2955ee016ef8126ee
      name: Memory pool non-paged
      type: ZABBIX_ACTIVE
      key: perf_counter_en["\Memory\Pool Nonpaged Bytes"]
      units: B
      description: 'This measures the size, in bytes, of the non-paged pool. This is an area of system memory for objects that cannot be written to disk but instead must remain in physical memory as long as they are allocated.

        There is a possible memory leak if the value is greater than 175MB (or 100MB with the /3GB switch). Consequently, Event ID 2019 is recorded in the system event log.

        '
      tags:
      - tag: component
        value: memory
    - uuid: 3ccbdcff1eb943cc84b1b43ada60c522
      name: Used swap space in %
      type: ZABBIX_ACTIVE
      key: perf_counter_en["\Paging file(_Total)\% Usage"]
      value_type: FLOAT
      units: '%'
      description: The used space of swap volume/file in percent.
      tags:
      - tag: component
        value: memory
      - tag: component
        value: storage
    - uuid: 5dbf39be7d164732ad2d765631fe5372
      name: CPU DPC time
      type: ZABBIX_ACTIVE
      key: perf_counter_en["\Processor Information(_total)\% DPC Time"]
      value_type: FLOAT
      units: '%'
      description: Processor DPC time is the time that a single processor spent receiving and servicing deferred procedure calls (DPCs). DPCs are interrupts that run at a lower priority than standard interrupts. `% DPC Time` is a component of `% Privileged Time` because DPCs are executed in privileged mode. If a high `% DPC Time` is sustained, there may be a processor bottleneck or an application or hardware related issue that can significantly diminish overall system performance.
      tags:
      - tag: component
        value: cpu
    - uuid: da0b4b7b04fc4696881006793156dfea
      name: CPU interrupt time
      type: ZABBIX_ACTIVE
      key: perf_counter_en["\Processor Information(_total)\% Interrupt Time"]
      value_type: FLOAT
      units: '%'
      description: The processor information `% Interrupt Time` counter indicates how much time the processor spends handling hardware interrupts during sample intervals. It reflects the activity of devices like the system clock, mouse, disk drivers, and network cards. A value above 20% suggests possible hardware issues.
      tags:
      - tag: component
        value: cpu
      triggers:
      - uuid: 8da75278b03d4bb5b6d230bfb4aa9f11
        expression: min(/Demo Windows by Zabbix agent active/perf_counter_en["\Processor Information(_total)\% Interrupt Time"],5m)>{$CPU.INTERRUPT.CRIT.MAX}
        name: 'Windows: CPU interrupt time is too high'
        event_name: 'Windows: CPU interrupt time is too high (over {$CPU.INTERRUPT.CRIT.MAX}% for 5m)'
        priority: WARNING
        description: The CPU Interrupt Time in the last 5 minutes exceeds `{$CPU.INTERRUPT.CRIT.MAX}`%.
        dependencies:
        - name: 'Windows: High CPU utilization'
          expression: min(/Demo Windows by Zabbix agent active/system.cpu.util,5m)>{$CPU.UTIL.CRIT}
        tags:
        - tag: scope
          value: performance
    - uuid: 16f445f260614a1ba4eedb124a765153
      name: CPU privileged time
      type: ZABBIX_ACTIVE
      key: perf_counter_en["\Processor Information(_total)\% Privileged Time"]
      value_type: FLOAT
      units: '%'
      description: The processor information `% Privileged Time` counter shows the percent of time that the processor is spent executing in Kernel (or Privileged) mode. Privileged mode includes services interrupts inside Interrupt Service Routines (ISRs), executing Deferred Procedure Calls (DPCs), Device Driver calls and other kernel-mode functions of the Windows Operating System.
      tags:
      - tag: component
        value: cpu
      triggers:
      - uuid: bbcddc80e59246f1b81d0f5ab43d277d
        expression: min(/Demo Windows by Zabbix agent active/perf_counter_en["\Processor Information(_total)\% Privileged Time"],5m)>{$CPU.PRIV.CRIT.MAX}
        name: 'Windows: CPU privileged time is too high'
        event_name: 'Windows: CPU privileged time is too high (over {$CPU.PRIV.CRIT.MAX}% for 5m)'
        priority: WARNING
        description: The CPU privileged time in the last 5 minutes exceeds {$CPU.PRIV.CRIT.MAX}%.
        dependencies:
        - name: 'Windows: CPU interrupt time is too high'
          expression: min(/Demo Windows by Zabbix agent active/perf_counter_en["\Processor Information(_total)\% Interrupt Time"],5m)>{$CPU.INTERRUPT.CRIT.MAX}
        - name: 'Windows: High CPU utilization'
          expression: min(/Demo Windows by Zabbix agent active/system.cpu.util,5m)>{$CPU.UTIL.CRIT}
        tags:
        - tag: scope
          value: performance
    - uuid: 4864d899ba044b42a7441cf0dffdb036
      name: CPU user time
      type: ZABBIX_ACTIVE
      key: perf_counter_en["\Processor Information(_total)\% User Time"]
      value_type: FLOAT
      units: '%'
      description: The processor information `% User Time` counter shows the percent of time that the processor(s) is spent executing in User mode.
      tags:
      - tag: component
        value: cpu
    - uuid: 844cacd791e8489e871037f18b1c22e6
      name: Context switches per second
      type: ZABBIX_ACTIVE
      key: perf_counter_en["\System\Context Switches/sec"]
      value_type: FLOAT
      description: 'Context Switches/sec is the combined rate at which all processors on the computer are switched from one thread to another.

        Context switches occur when a running thread voluntarily relinquishes the processor, is preempted by a higher priority ready thread, or switches between user-mode and privileged (kernel) mode to use an Executive or subsystem service.

        It is the sum of Thread\\Context Switches/sec for all threads running on all processors in the computer and is measured in numbers of switches.

        There are context switch counters on the System and Thread objects. This counter displays the difference between the values observed in the last two samples, divided by the duration of the sample interval.

        '
      tags:
      - tag: component
        value: cpu
    - uuid: 50d2adea64374aa09082b819c4093f1a
      name: CPU queue length
      type: ZABBIX_ACTIVE
      key: perf_counter_en["\System\Processor Queue Length"]
      value_type: FLOAT
      description: The Processor Queue Length shows the number of threads that are observed as delayed in the processor Ready Queue and are waiting to be executed.
      tags:
      - tag: component
        value: cpu
    - uuid: b2ce3dc69a1e43e68125aef1e9be676b
      name: Number of threads
      type: ZABBIX_ACTIVE
      key: perf_counter_en["\System\Threads"]
      description: The number of threads used by all running processes.
      tags:
      - tag: component
        value: os
    - uuid: 72f05efd24de4e25969429fd75d23910
      name: Number of processes
      type: ZABBIX_ACTIVE
      key: proc.num[]
      description: The number of processes.
      tags:
      - tag: component
        value: os
    - uuid: e1ab204af092428a8d545c997a3200db
      name: CPU utilization
      type: ZABBIX_ACTIVE
      key: system.cpu.util
      value_type: FLOAT
      units: '%'
      description: CPU utilization expressed in %.
      tags:
      - tag: component
        value: cpu
      triggers:
      - uuid: 5a36c313d9a84c55981c3d725f9c88c5
        expression: min(/Demo Windows by Zabbix agent active/system.cpu.util,5m)>{$CPU.UTIL.CRIT}
        name: 'Windows: High CPU utilization'
        event_name: 'Windows: High CPU utilization (over {$CPU.UTIL.CRIT}% for 5m)'
        opdata: 'Current utilization: {ITEM.LASTVALUE1}'
        priority: WARNING
        description: CPU utilization is too high. The system might be slow to respond.
        tags:
        - tag: scope
          value: performance
      - uuid: 7debe117558642a5872a474d02b32dba
        expression: avg(/Demo Windows by Zabbix agent active/system.cpu.util,1m)>85
        name: 'Demo: CPU 1분 평균 85% 초과'
        opdata: 현재 {ITEM.LASTVALUE1}
        priority: HIGH
        description: 데모 장애 주입(infra/scripts/inject-cpu.ps1)용. 1분 평균 CPU 사용률이 85%를 넘으면 High. 부하가 끝나 평균이 내려가면 자동 해소.
        tags:
        - tag: scope
          value: performance
        - tag: project
          value: demo
      delay: 30s
    - uuid: f152279da0744db3bcf70044472765c1
      name: System name
      type: ZABBIX_ACTIVE
      key: system.hostname
      delay: 1h
      value_type: CHAR
      trends: '0'
      description: The host name of the system.
      inventory_link: NAME
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: component
        value: system
      triggers:
      - uuid: 6dd0c90d95c642f0b9b39d69e9ddb614
        expression: change(/Demo Windows by Zabbix agent active/system.hostname) and length(last(/Demo Windows by Zabbix agent active/system.hostname))>0
        name: 'Windows: System name has changed'
        event_name: 'Windows: System name has changed (new name: {ITEM.VALUE})'
        priority: INFO
        description: The name of the system has changed. Acknowledge to close the problem manually.
        manual_close: 'YES'
        tags:
        - tag: scope
          value: notice
    - uuid: c320c0f8758f4e04ab27fbc19bf2fdb4
      name: System local time
      type: ZABBIX_ACTIVE
      key: system.localtime
      units: unixtime
      description: The local system time of the host.
      tags:
      - tag: component
        value: system
    - uuid: 037f8911e80b443da49b05556f86d34b
      name: Operating system architecture
      type: ZABBIX_ACTIVE
      key: system.sw.arch
      delay: 1h
      value_type: CHAR
      trends: '0'
      description: The architecture of the operating system.
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: component
        value: os
    - uuid: 1da364d16bf44d2cb6a027965abc96c0
      name: Operating system
      type: ZABBIX_ACTIVE
      key: system.sw.os
      delay: 1h
      value_type: CHAR
      trends: '0'
      inventory_link: OS
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: component
        value: os
      triggers:
      - uuid: fa2f21f2ace24a8db7bff1090a4f4fcf
        expression: change(/Demo Windows by Zabbix agent active/system.sw.os) and length(last(/Demo Windows by Zabbix agent active/system.sw.os))>0
        name: 'Windows: Operating system description has changed'
        priority: INFO
        description: The description of the operating system has changed. Possible reasons are that the system has been updated or replaced. Acknowledge to close the problem manually.
        manual_close: 'YES'
        dependencies:
        - name: 'Windows: System name has changed'
          expression: change(/Demo Windows by Zabbix agent active/system.hostname) and length(last(/Demo Windows by Zabbix agent active/system.hostname))>0
        tags:
        - tag: scope
          value: notice
    - uuid: 175bab53d5ba4201b86aba4d205151b3
      name: Free swap space
      type: CALCULATED
      key: system.swap.free
      units: B
      params: last(//system.swap.size[,total]) - last(//system.swap.size[,total]) / 100 * last(//perf_counter_en["\Paging file(_Total)\% Usage"])
      description: The free space of the swap volume/file expressed in bytes.
      tags:
      - tag: component
        value: memory
      - tag: component
        value: storage
    - uuid: c4251e314ad34b6e8d470e4f0061d185
      name: Free swap space in %
      type: DEPENDENT
      key: system.swap.pfree
      delay: '0'
      value_type: FLOAT
      units: '%'
      description: The free space of the swap volume/file expressed in %.
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - return (100 - value)
      master_item:
        key: perf_counter_en["\Paging file(_Total)\% Usage"]
      tags:
      - tag: component
        value: memory
      - tag: component
        value: storage
    - uuid: 17fb26ed145c46e2919b33580ea113b3
      name: Total swap space
      type: ZABBIX_ACTIVE
      key: system.swap.size[,total]
      units: B
      description: The total space of the swap volume/file expressed in bytes.
      tags:
      - tag: component
        value: memory
      - tag: component
        value: storage
    - uuid: 9f1063c36e3b45ae95a7c3d9078b25aa
      name: System description
      type: ZABBIX_ACTIVE
      key: system.uname
      delay: 15m
      value_type: CHAR
      trends: '0'
      description: System description of the host.
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: component
        value: system
    - uuid: 10657ae385df41309d53c6ba87a18048
      name: Uptime
      type: ZABBIX_ACTIVE
      key: system.uptime
      delay: 30s
      trends: '0'
      units: uptime
      description: 'The system uptime expressed in the following format: "N days, hh:mm:ss".'
      tags:
      - tag: component
        value: system
      triggers:
      - uuid: c73f46fb84074a0ea9b0c009d725cc52
        expression: last(/Demo Windows by Zabbix agent active/system.uptime)<10m
        name: 'Windows: Host has been restarted'
        event_name: 'Windows: Host has been restarted (uptime < 10m)'
        priority: WARNING
        description: The device uptime is less than 10 minutes.
        manual_close: 'YES'
        tags:
        - tag: scope
          value: notice
    - uuid: e603e9c5f4324e2d95b63d75e414b1a3
      name: Get filesystems
      type: ZABBIX_ACTIVE
      key: vfs.fs.get
      history: '0'
      value_type: TEXT
      trends: '0'
      description: The `vfs.fs.get` key acquires raw information set about the filesystems. Later to be extracted by preprocessing in dependent items.
      tags:
      - tag: component
        value: raw
    - uuid: f8ad5b3bf652484d84a757b1ddd09425
      name: Total memory
      type: ZABBIX_ACTIVE
      key: vm.memory.size[total]
      units: B
      description: Total memory expressed in bytes.
      tags:
      - tag: component
        value: memory
    - uuid: 74f23b16fc9c4759bc3330cc0f144006
      name: Used memory
      type: ZABBIX_ACTIVE
      key: vm.memory.size[used]
      units: B
      description: Used memory in bytes.
      tags:
      - tag: component
        value: memory
    - uuid: fa05af23e947477ca7c6bb87e8539643
      name: Memory utilization
      type: CALCULATED
      key: vm.memory.util
      value_type: FLOAT
      units: '%'
      params: last(//vm.memory.size[used]) / last(//vm.memory.size[total]) * 100
      description: Memory utilization in %.
      tags:
      - tag: component
        value: memory
      triggers:
      - uuid: d687a5ca66c14a2282befd68075a7c01
        expression: min(/Demo Windows by Zabbix agent active/vm.memory.util,5m)>{$MEMORY.UTIL.MAX}
        name: 'Windows: High memory utilization'
        event_name: 'Windows: High memory utilization (>{$MEMORY.UTIL.MAX}% for 5m)'
        priority: AVERAGE
        description: The system is running out of free memory.
        tags:
        - tag: scope
          value: capacity
        - tag: scope
          value: performance
    - uuid: 0a1c1a1778644e36a955aa7348e2940b
      name: 'Windows: Network interfaces WMI get'
      type: ZABBIX_ACTIVE
      key: wmi.getall[root\cimv2,"select Name,Description,NetConnectionID,Speed,AdapterTypeId,NetConnectionStatus,GUID from win32_networkadapter where PhysicalAdapter=True and NetConnectionStatus>0"]
      history: '0'
      value_type: TEXT
      trends: '0'
      description: Raw data of `win32_networkadapter.`
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      tags:
      - tag: component
        value: raw
    - uuid: 2f8d2fd2ac91411183f2d07a8968b59c
      name: Number of cores
      type: ZABBIX_ACTIVE
      key: wmi.get[root/cimv2,"Select NumberOfLogicalProcessors from Win32_ComputerSystem"]
      description: The number of logical processors available on the computer.
      tags:
      - tag: component
        value: cpu
    - uuid: 4ea6f6e75dfd4b4bb77a2b78e540445e
      name: Active agent availability
      type: INTERNAL
      key: zabbix[host,active_agent,available]
      description: 'Availability of active checks on the host. The value of this item corresponds to availability icons in the host list.

        Possible values:

        0 - unknown

        1 - available

        2 - not available

        '
      valuemap:
        name: zabbix.host.active_agent.available
      tags:
      - tag: component
        value: health
      - tag: component
        value: network
      triggers:
      - uuid: 2a63f8e7570c4b0d81cd53b46423dc21
        expression: min(/Demo Windows by Zabbix agent active/zabbix[host,active_agent,available],{$AGENT.TIMEOUT})=2
        name: 'Windows: Active checks are not available'
        opdata: 'Current state: {ITEM.LASTVALUE1}'
        priority: HIGH
        description: Active checks are considered unavailable. Agent has not sent a heartbeat for a prolonged time.
        tags:
        - tag: scope
          value: availability
    discovery_rules:
    - uuid: 51ad0dd3b838407e9a4918bf622ec6ef
      name: Network interfaces discovery
      type: DEPENDENT
      key: net.if.discovery
      delay: '0'
      filter:
        evaltype: AND
        conditions:
        - macro: '{#IFALIAS}'
          value: '{$NET.IF.IFALIAS.MATCHES}'
          formulaid: A
        - macro: '{#IFALIAS}'
          value: '{$NET.IF.IFALIAS.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
          formulaid: B
        - macro: '{#IFDESCR}'
          value: '{$NET.IF.IFDESCR.MATCHES}'
          formulaid: C
        - macro: '{#IFDESCR}'
          value: '{$NET.IF.IFDESCR.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
          formulaid: D
        - macro: '{#IFNAME}'
          value: '{$NET.IF.IFNAME.MATCHES}'
          formulaid: E
        - macro: '{#IFNAME}'
          value: '{$NET.IF.IFNAME.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
          formulaid: F
      description: Discovery of installed network interfaces.
      item_prototypes:
      - uuid: 93048a2b28564d9caa20178195c4b113
        name: 'Interface {#IFNAME}({#IFALIAS}): Inbound packets discarded'
        type: ZABBIX_ACTIVE
        key: net.if.in["{#IFGUID}",dropped]
        delay: 3m
        description: The number of incoming packets dropped on the network interface.
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
