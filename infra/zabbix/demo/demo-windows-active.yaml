          expression: min(/Demo Windows by Zabbix agent active/perf_counter_en["\PhysicalDisk({#DEVNAME})\Avg. Disk sec/Write",60],15m) > {$VFS.DEV.WRITE.AWAIT.WARN:"{#DEVNAME}"}
          name: 'Windows: {#DEVNAME}: Disk write request responses are too high'
