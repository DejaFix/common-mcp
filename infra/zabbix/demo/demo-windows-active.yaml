      - uuid: 97bbbfc6af4543a0af8890be16f8ccbd
        name: 'Interface {#IFNAME}({#IFALIAS}): Operational status'
        type: DEPENDENT
        key: net.if.status["{#IFGUID}"]
        delay: '0'
        trends: '0'
        description: The operational status of the network interface.
        valuemap:
          name: Win32_NetworkAdapter::NetConnectionStatus
        preprocessing:
        - type: JSONPATH
          parameters:
          - $[?(@.GUID == "{#IFGUID}")].NetConnectionStatus.first()
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1d
        master_item:
          key: wmi.getall[root\cimv2,"select Name,Description,NetConnectionID,Speed,AdapterTypeId,NetConnectionStatus,GUID from win32_networkadapter where PhysicalAdapter=True and NetConnectionStatus>0"]
        tags:
        - tag: component
          value: network
        - tag: description
          value: '{#IFALIAS}'
        - tag: interface
          value: '{#IFNAME}'
        trigger_prototypes:
        - uuid: ec1839f4f26b4e499af4d0c228cb0563
          expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/Demo Windows by Zabbix agent active/net.if.status["{#IFGUID}"])<>2 and (last(/Demo Windows by Zabbix agent active/net.if.status["{#IFGUID}"],#1)<>last(/Demo Windows by Zabbix agent active/net.if.status["{#IFGUID}"],#2))'
          recovery_mode: RECOVERY_EXPRESSION
          recovery_expression: last(/Demo Windows by Zabbix agent active/net.if.status["{#IFGUID}"])=2 or {$IFCONTROL:"{#IFNAME}"}=0
          name: 'Windows: Interface {#IFNAME}({#IFALIAS}): Link down'
          opdata: 'Current state: {ITEM.LASTVALUE1}'
          priority: AVERAGE
          description: 'This trigger expression works as follows:

            1. It can be triggered if the operations status is down.

            2. `{$IFCONTROL:"{#IFNAME}"}=1` - a user can redefine the context macro to "0", marking this interface as not important.

            No new trigger will be fired if this interface is down.

            3. `last(/TEMPLATE_NAME/METRIC,#1)<>last(/TEMPLATE_NAME/METRIC,#2)` - the trigger fires only if the operational status was up to (1) sometime before (so, does not fire for "eternal off" interfaces.)


            WARNING: if closed manually - it will not fire again on the next poll, because of .diff.

            '
          manual_close: 'YES'
          tags:
          - tag: scope
            value: availability
      - uuid: c472010d804c4dc183e8801f61a2e819
        name: 'Interface {#IFNAME}({#IFALIAS}): Interface type'
        type: DEPENDENT
        key: net.if.type["{#IFGUID}"]
        delay: '0'
        trends: '0'
        description: The type of the network interface.
        valuemap:
          name: Win32_NetworkAdapter::AdapterTypeId
        preprocessing:
        - type: JSONPATH
          parameters:
          - $[?(@.GUID == "{#IFGUID}")].AdapterTypeId.first()
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1d
        master_item:
          key: wmi.getall[root\cimv2,"select Name,Description,NetConnectionID,Speed,AdapterTypeId,NetConnectionStatus,GUID from win32_networkadapter where PhysicalAdapter=True and NetConnectionStatus>0"]
        tags:
        - tag: component
          value: network
        - tag: description
          value: '{#IFALIAS}'
        - tag: interface
          value: '{#IFNAME}'
      trigger_prototypes:
      - uuid: 929f3b420d1a4e49ac433e4a7699de7c
        expression: 'change(/Demo Windows by Zabbix agent active/net.if.speed["{#IFGUID}"])<0 and

          last(/Demo Windows by Zabbix agent active/net.if.speed["{#IFGUID}"])>0 and

          last(/Demo Windows by Zabbix agent active/net.if.status["{#IFGUID}"])=2

          '
        name: 'Windows: Interface {#IFNAME}({#IFALIAS}): Ethernet has changed to lower speed than it was before'
        opdata: 'Current reported speed: {ITEM.LASTVALUE1}'
        priority: INFO
        description: This Ethernet connection has transitioned down from its known maximum speed. This might be a sign of autonegotiation issues. Acknowledge to close the problem manually.
        manual_close: 'YES'
        dependencies:
        - name: 'Windows: Interface {#IFNAME}({#IFALIAS}): Link down'
          expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/Demo Windows by Zabbix agent active/net.if.status["{#IFGUID}"])<>2 and (last(/Demo Windows by Zabbix agent active/net.if.status["{#IFGUID}"],#1)<>last(/Demo Windows by Zabbix agent active/net.if.status["{#IFGUID}"],#2))'
          recovery_expression: last(/Demo Windows by Zabbix agent active/net.if.status["{#IFGUID}"])=2 or {$IFCONTROL:"{#IFNAME}"}=0
        tags:
        - tag: scope
          value: capacity
      - uuid: ec667659f20c406f861f71940b8a5bd1
        expression: '(avg(/Demo Windows by Zabbix agent active/net.if.in["{#IFGUID}"],15m)>({$IF.UTIL.MAX:"{#IFNAME}"}/100)*last(/Demo Windows by Zabbix agent active/net.if.speed["{#IFGUID}"]) or

          avg(/Demo Windows by Zabbix agent active/net.if.out["{#IFGUID}"],15m)>({$IF.UTIL.MAX:"{#IFNAME}"}/100)*last(/Demo Windows by Zabbix agent active/net.if.speed["{#IFGUID}"])) and

          last(/Demo Windows by Zabbix agent active/net.if.speed["{#IFGUID}"])>0

          '
        recovery_mode: RECOVERY_EXPRESSION
        recovery_expression: 'avg(/Demo Windows by Zabbix agent active/net.if.in["{#IFGUID}"],15m)<(({$IF.UTIL.MAX:"{#IFNAME}"}-3)/100)*last(/Demo Windows by Zabbix agent active/net.if.speed["{#IFGUID}"]) and

          avg(/Demo Windows by Zabbix agent active/net.if.out["{#IFGUID}"],15m)<(({$IF.UTIL.MAX:"{#IFNAME}"}-3)/100)*last(/Demo Windows by Zabbix agent active/net.if.speed["{#IFGUID}"])

          '
        name: 'Windows: Interface {#IFNAME}({#IFALIAS}): High bandwidth usage'
        event_name: 'Windows: Interface {#IFNAME}({#IFALIAS}): High bandwidth usage (>{$IF.UTIL.MAX:"{#IFNAME}"}%)'
        opdata: 'In: {ITEM.LASTVALUE1}, out: {ITEM.LASTVALUE3}, speed: {ITEM.LASTVALUE2}'
        priority: WARNING
        description: The utilization of the network interface is close to its estimated maximum bandwidth.
        manual_close: 'YES'
        dependencies:
        - name: 'Windows: Interface {#IFNAME}({#IFALIAS}): Link down'
          expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/Demo Windows by Zabbix agent active/net.if.status["{#IFGUID}"])<>2 and (last(/Demo Windows by Zabbix agent active/net.if.status["{#IFGUID}"],#1)<>last(/Demo Windows by Zabbix agent active/net.if.status["{#IFGUID}"],#2))'
          recovery_expression: last(/Demo Windows by Zabbix agent active/net.if.status["{#IFGUID}"])=2 or {$IFCONTROL:"{#IFNAME}"}=0
        tags:
        - tag: scope
          value: performance
      - uuid: 0698de67d3b24182975e35657d95d79f
        expression: 'min(/Demo Windows by Zabbix agent active/net.if.in["{#IFGUID}",errors],5m)>{$IF.ERRORS.WARN:"{#IFNAME}"}

          or min(/Demo Windows by Zabbix agent active/net.if.out["{#IFGUID}",errors],5m)>{$IF.ERRORS.WARN:"{#IFNAME}"}

          '
        recovery_mode: RECOVERY_EXPRESSION
        recovery_expression: 'max(/Demo Windows by Zabbix agent active/net.if.in["{#IFGUID}",errors],5m)<{$IF.ERRORS.WARN:"{#IFNAME}"}*0.8

          and max(/Demo Windows by Zabbix agent active/net.if.out["{#IFGUID}",errors],5m)<{$IF.ERRORS.WARN:"{#IFNAME}"}*0.8

          '
        name: 'Windows: Interface {#IFNAME}({#IFALIAS}): High error rate'
        event_name: 'Windows: Interface {#IFNAME}({#IFALIAS}): High error rate (>{$IF.ERRORS.WARN:"{#IFNAME}"} for 5m)'
        opdata: 'errors in: {ITEM.LASTVALUE1}, errors out: {ITEM.LASTVALUE2}'
        priority: WARNING
        description: It recovers when it is below 80% of the `{$IF.ERRORS.WARN:"{#IFNAME}"}` threshold.
        manual_close: 'YES'
        dependencies:
        - name: 'Windows: Interface {#IFNAME}({#IFALIAS}): Link down'
          expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/Demo Windows by Zabbix agent active/net.if.status["{#IFGUID}"])<>2 and (last(/Demo Windows by Zabbix agent active/net.if.status["{#IFGUID}"],#1)<>last(/Demo Windows by Zabbix agent active/net.if.status["{#IFGUID}"],#2))'
          recovery_expression: last(/Demo Windows by Zabbix agent active/net.if.status["{#IFGUID}"])=2 or {$IFCONTROL:"{#IFNAME}"}=0
        tags:
        - tag: scope
          value: availability
      graph_prototypes:
      - uuid: e0368273d62644ac805f562c9efa6ff3
        name: 'Interface {#IFNAME}({#IFALIAS}): Network traffic'
        graph_items:
        - drawtype: GRADIENT_LINE
          color: 199C0D
          item:
            host: Demo Windows by Zabbix agent active
            key: net.if.in["{#IFGUID}"]
        - sortorder: '1'
          drawtype: BOLD_LINE
          color: F63100
          item:
            host: Demo Windows by Zabbix agent active
            key: net.if.out["{#IFGUID}"]
        - sortorder: '2'
          color: 00611C
          yaxisside: RIGHT
          item:
            host: Demo Windows by Zabbix agent active
            key: net.if.out["{#IFGUID}",errors]
        - sortorder: '3'
          color: F7941D
          yaxisside: RIGHT
          item:
            host: Demo Windows by Zabbix agent active
            key: net.if.in["{#IFGUID}",errors]
        - sortorder: '4'
          color: FC6EA3
          yaxisside: RIGHT
          item:
            host: Demo Windows by Zabbix agent active
            key: net.if.out["{#IFGUID}",dropped]
        - sortorder: '5'
          color: 6C59DC
          yaxisside: RIGHT
          item:
            host: Demo Windows by Zabbix agent active
            key: net.if.in["{#IFGUID}",dropped]
      master_item:
        key: wmi.getall[root\cimv2,"select Name,Description,NetConnectionID,Speed,AdapterTypeId,NetConnectionStatus,GUID from win32_networkadapter where PhysicalAdapter=True and NetConnectionStatus>0"]
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - "output = JSON.parse(value).map(function(net){\n\treturn {\n\t\t\"{#IFNAME}\": net.Name,\n\t\t\"{#IFDESCR}\": net.Description,\n\t\t\"{#IFALIAS}\": net.NetConnectionID,\n\t\t\"{#IFGUID}\": net.GUID\n\t}})\nreturn JSON.stringify({\"data\": output})\n"
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
    - uuid: 246a12c9649444989a02ce000f41443d
      name: Physical disks discovery
      type: ZABBIX_ACTIVE
      key: perf_instance_en.discovery[PhysicalDisk]
      delay: 1h
      filter:
        evaltype: AND
        conditions:
        - macro: '{#DEVNAME}'
          value: '{$VFS.DEV.DEVNAME.MATCHES}'
          formulaid: A
        - macro: '{#DEVNAME}'
          value: '{$VFS.DEV.DEVNAME.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
          formulaid: B
      description: Discovery of installed physical disks.
      item_prototypes:
      - uuid: a46c861d867440c686b7606de5bfbe74
        name: '{#DEVNAME}: Disk utilization by idle time'
        type: ZABBIX_ACTIVE
        key: perf_counter_en["\PhysicalDisk({#DEVNAME})\% Idle Time",60]
        value_type: FLOAT
        units: '%'
        description: This item is the percentage of elapsed time that the selected disk drive was busy servicing read or writes requests based on idle time.
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - return (100 - value)
        tags:
        - tag: component
          value: storage
        - tag: disk
          value: '{#DEVNAME}'
        trigger_prototypes:
        - uuid: 03ce389ab5ab49acb5256e78b5095d7f
          expression: min(/Demo Windows by Zabbix agent active/perf_counter_en["\PhysicalDisk({#DEVNAME})\% Idle Time",60],15m)>{$VFS.DEV.UTIL.MAX.WARN}
          name: 'Windows: {#DEVNAME}: Disk is overloaded'
          event_name: 'Windows: {#DEVNAME}: Disk is overloaded (util > {$VFS.DEV.UTIL.MAX.WARN}% for 15m)'
          priority: WARNING
          description: The disk appears to be under heavy load.
          manual_close: 'YES'
          dependencies:
          - name: 'Windows: {#DEVNAME}: Disk read request responses are too high'
            expression: min(/Demo Windows by Zabbix agent active/perf_counter_en["\PhysicalDisk({#DEVNAME})\Avg. Disk sec/Read",60],15m) > {$VFS.DEV.READ.AWAIT.WARN:"{#DEVNAME}"}
          - name: 'Windows: {#DEVNAME}: Disk write request responses are too high'
            expression: min(/Demo Windows by Zabbix agent active/perf_counter_en["\PhysicalDisk({#DEVNAME})\Avg. Disk sec/Write",60],15m) > {$VFS.DEV.WRITE.AWAIT.WARN:"{#DEVNAME}"}
          tags:
          - tag: scope
            value: performance
      - uuid: 8924f8b5a5f74611a90524cc7ec22edc
        name: '{#DEVNAME}: Average disk read queue length'
        type: ZABBIX_ACTIVE
        key: perf_counter_en["\PhysicalDisk({#DEVNAME})\Avg. Disk Read Queue Length",60]
        value_type: FLOAT
        description: Average disk read queue, the number of requests outstanding on the disk at the time the performance data is collected.
        tags:
        - tag: component
          value: storage
        - tag: disk
          value: '{#DEVNAME}'
      - uuid: 751e763c223f4f409e2db42b0e80f179
        name: '{#DEVNAME}: Disk read request avg waiting time'
        type: ZABBIX_ACTIVE
        key: perf_counter_en["\PhysicalDisk({#DEVNAME})\Avg. Disk sec/Read",60]
        value_type: FLOAT
        units: s
        description: The average time for read requests issued to the device to be served. This includes the time spent by the requests in queue and the time spent servicing them.
        tags:
        - tag: component
          value: storage
        - tag: disk
          value: '{#DEVNAME}'
        trigger_prototypes:
        - uuid: 76bc74547db24f739bf2671e387a4fba
          expression: min(/Demo Windows by Zabbix agent active/perf_counter_en["\PhysicalDisk({#DEVNAME})\Avg. Disk sec/Read",60],15m) > {$VFS.DEV.READ.AWAIT.WARN:"{#DEVNAME}"}
          name: 'Windows: {#DEVNAME}: Disk read request responses are too high'
          event_name: 'Windows: {#DEVNAME}: Disk read request responses are too high (read > {$VFS.DEV.READ.AWAIT.WARN:"{#DEVNAME}"}s for 15m)'
          priority: WARNING
          description: This trigger might indicate the disk {#DEVNAME} saturation.
          manual_close: 'YES'
          tags:
